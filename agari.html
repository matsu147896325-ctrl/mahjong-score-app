<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d315d">
    <meta name="description" content="麻雀の手牌を入力すると、聴牌の待ち牌やイーシャンテンから聴牌になる牌を表示する無料ツールです。手役・符・得点も確認できます。">
    <meta name="robots" content="index, follow">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ja_JP">
    <meta property="og:title" content="麻雀 アガリ牌表示">
    <meta property="og:description" content="麻雀の手牌から待ち牌を自動表示。手役・符・得点の確認にも対応。">
    <meta property="og:url" content="https://whitedogk.github.io/mahjong-score-app/agari.html">
    <title>麻雀 アガリ牌表示</title>
    <link rel="canonical" href="https://whitedogk.github.io/mahjong-score-app/agari.html">
    <link rel="stylesheet" href="agari.css?v=20">
  </head>
  <body>
    <main class="wait-app">
      <header class="wait-top">
        <div>
          <h1>麻雀 アガリ牌表示</h1>
          <p>手牌を13枚入力すると、待ち牌を自動表示</p>
        </div>
      </header>

      <section class="settings">
        <label>
          場風
          <select id="roundWind"></select>
        </label>
        <label>
          自風
          <select id="seatWind"></select>
        </label>
        <label>
          本場
          <select id="honba"></select>
        </label>
      </section>

      <section class="panel hand-panel">
        <div class="hand-panel-grid">
          <div>
            <div class="section-head">
              <h2>手牌</h2>
              <span id="handCount">0 / 13</span>
            </div>
            <div class="hand-row" id="handSlots"></div>
          </div>
          <div class="hand-tools">
            <div class="mode-grid" id="modeButtons"></div>
          </div>
        </div>
      </section>

      <section class="panel candidate-panel">
        <div class="section-head">
          <h2>牌候補</h2>
          <div class="candidate-head-controls">
            <span id="modeHint">牌を押すと手牌に入ります</span>
            <button type="button" id="undoButton">前に戻る</button>
            <button type="button" id="resetButton">リセット</button>
          </div>
        </div>
        <div class="candidate-layout">
          <div class="candidate-main">
            <div class="chi-choices" id="chiChoices"></div>
            <div class="tile-candidates" id="tileCandidates"></div>
          </div>
          <div class="compact-status">
            <section class="status-box">
              <div class="section-head">
                <h2>ドラ</h2>
                <div class="dora-tools">
                  <button type="button" id="doraModeButton">ドラ追加</button>
                  <span id="doraCount">0枚</span>
                </div>
              </div>
              <div class="dora-box" id="doraBox">未選択</div>
            </section>
            <section class="status-box">
              <div class="section-head">
                <h2>副露</h2>
                <span id="meldCount">0 / 4</span>
              </div>
              <div class="meld-area" id="meldArea"></div>
            </section>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="section-head">
          <h2>待ち</h2>
          <span id="waitStatus">13枚になるよう入力</span>
        </div>
        <div class="wait-row" id="waitTiles"></div>
      </section>

      <section class="panel result-panel">
        <div class="section-head result-headline">
          <h2>アガリ結果</h2>
          <div class="result-controls">
            <div class="win-toggle" id="winTypeButtons"></div>
            <div class="situation-buttons" id="situationButtons"></div>
            <div class="han-adjust" id="hanAdjustButtons" aria-label="追加翻の調整"></div>
          </div>
        </div>
        <div id="agariResult" class="agari-empty">待ち牌を選ぶと、手役・符・得点を表示します</div>
      </section>
    </main>

    <script src="agari.js?v=22"></script>
  </body>
</html>

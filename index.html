<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d315d">
    <meta name="description" content="麻雀の符数と翻数から、親・子のロンとツモの得点を自動計算できる無料ツールです。アガリ牌表示にも対応しています。">
    <meta name="robots" content="index, follow">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ja_JP">
    <meta property="og:title" content="麻雀 得点計算">
    <meta property="og:description" content="麻雀の符数と翻数から、親・子のロンとツモの得点を自動計算。アガリ牌表示にも対応。">
    <meta property="og:url" content="https://whitedogk.github.io/mahjong-score-app/">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="麻雀得点">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>麻雀 得点計算</title>
    <link rel="canonical" href="https://whitedogk.github.io/mahjong-score-app/">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="styles.css?v=10">
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <h1>麻雀 得点計算</h1>
          <p>符数と翻数から、ロン・ツモの支払い点を自動計算</p>
        </div>
        <div class="top-tools">
          <a href="agari.html?v=23">アガリ牌表示へ</a>
          <label class="honba">
            <span>本場</span>
            <select id="honba" aria-label="本場数"></select>
          </label>
        </div>
      </header>

      <section class="panel">
        <h2>上がり方</h2>
        <div class="button-grid four" id="styleGroup"></div>
      </section>

      <section class="panel meld-panel">
        <div class="section-title">
          <h2>面子</h2>
          <span>各行の符数</span>
        </div>
        <div class="meld-table" id="meldTable"></div>
      </section>

      <section class="split">
        <div class="panel">
          <h2>雀頭</h2>
          <div class="button-grid two" id="headGroup"></div>
        </div>

        <div class="panel">
          <h2>待ち</h2>
          <div class="button-grid six" id="waitGroup"></div>
        </div>
      </section>

      <section class="panel">
        <h2>翻数</h2>
        <div class="han-grid" id="hanGroup"></div>
      </section>

      <section class="result">
        <div class="result-table">
          <div class="result-head ron-head">ロン</div>
          <div class="result-head tsumo-head">ツモ</div>

          <div class="result-label">符</div>
          <div class="result-label">翻</div>
          <div class="result-label">親</div>
          <div class="result-label">子</div>
          <div class="result-label">符</div>
          <div class="result-label">翻</div>
          <div class="result-label">親</div>
          <div class="result-label child-pay">子</div>

          <div class="result-value" id="ronFuText">30符</div>
          <div class="result-value" id="ronHanText">1翻</div>
          <div class="result-value score" id="ronParent">1,500</div>
          <div class="result-value score" id="ronChild">1,000</div>
          <div class="result-value" id="tsumoFuText">30符</div>
          <div class="result-value" id="tsumoHanText">1翻</div>
          <div class="result-value score" id="tsumoParent">500</div>
          <div class="result-value split-score">
            <span id="tsumoChildFromChild">300</span>
            <span id="tsumoChildFromParent">500</span>
          </div>
        </div>
      </section>
    </main>

    <script src="app.js?v=10"></script>
  </body>
</html>
